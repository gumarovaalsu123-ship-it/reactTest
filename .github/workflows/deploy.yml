
name: Deploy Green Mood

on:
  push:
    branches:
      - main
    paths:
      - 'reactPr1/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reactPr1/package-lock.json

      - name: Install dependencies
        working-directory: reactPr1
        run: npm ci

      - name: Build project
        working-directory: reactPr1
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: reactPr1/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
